[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskbox"
version = "0.1.0"
description = "A personal scheduled task framework running on Serverless platform"
authors = [
    {name = "jneeee", email = "jneeee@outlook.com"},
]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "rsa>=4.9",
    "requests>=2.28.1",
    "Jinja2>=3.1.2",
    "boto3>=1.26.8",
    "botocore>=1.29.8",
    "pyaes>=1.6.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "flake8>=6.0.0",
    "moto>=4.0.0",
]

[tool.uv.sources]
taskbox = { path = ".", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/taskbox"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.black]
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line-length = 88
skip_gitignore = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/taskbox/tests"]
